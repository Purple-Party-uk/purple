<section class="say" id="say">
  <h2>Have your say</h2>
  <p class="say-intro">This policy is open for comment. Tell us what works, what doesn't, or what we've missed. Responses come to us and are not published.</p>
  <form id="sayForm" method="POST" action="{{ site.comment_form_endpoint }}" novalidate>
    <input type="hidden" name="policy" value="{{ page.title }}">
    <div class="row2">
      <label>Name <span class="opt">(optional)</span><input name="name" autocomplete="name"></label>
      <label>Email <span class="opt">(optional, if you'd like a reply)</span><input name="email" type="email" autocomplete="email"></label>
    </div>
    <label>Your comments<textarea name="message" rows="6" required></textarea></label>
    <label class="check"><input type="checkbox" name="consent" value="yes" required> I agree to Purple storing my comments to help develop this policy, as set out in the <a href="{{ '/privacy/' | relative_url }}">privacy notice</a>.</label>
    <p class="form-err" id="sayErr" hidden></p>
    <button class="btn violet" type="submit">Send comments</button>
  </form>
  <div class="say-done" id="sayDone" hidden><h3>Thank you.</h3><p>Your comments have been sent.</p></div>
</section>
