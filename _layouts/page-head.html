---
layout: default
---
<div class="page-head{% if page.head_class %} {{ page.head_class }}{% endif %}"><div class="wrap">
  {% if page.crumbs %}<nav class="crumbs" aria-label="Breadcrumb">{{ page.crumbs }}</nav>{% endif %}
  {% if page.tag %}<span class="tag">{{ page.tag }}</span>{% endif %}
  <h1>{{ page.heading | default: page.title }}</h1>
  {% if page.lede %}<p class="lede">{{ page.lede }}</p>{% endif %}
  {% if page.manifesto_link %}<a class="manifesto-link" href="{{ site.manifesto_pdf | relative_url }}">Download the full manifesto (PDF)</a>{% endif %}
</div></div>
{{ content }}
