<!DOCTYPE html>
<html lang="en-GB" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% if page.title and page.nav != 'home' %}{{ page.title }} | {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.summary | default: page.lede | default: site.description | strip_html | escape }}">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.summary | default: page.lede | default: site.description | strip_html | escape }}">
<meta property="og:type" content="website">
<link rel="icon" href="{{ '/assets/img/logo/purple-icon.svg' | relative_url }}" type="image/svg+xml">
<link rel="icon" href="{{ '/assets/img/logo/favicon-32.png' | relative_url }}" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="{{ '/assets/img/logo/apple-touch-icon.png' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body class="dark-top{% if page.nav == 'home' %} is-home{% endif %}" data-base="{{ site.baseurl }}">
{% include header.html %}
<main id="app">
{{ content }}
</main>
{% include footer.html %}
<script>window.PURPLE = { donateUrl: "{{ site.donate_url }}", joinFormUrl: "{{ site.join_form_url }}", commentEndpoint: "{{ site.comment_form_endpoint }}" };</script>
<script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
