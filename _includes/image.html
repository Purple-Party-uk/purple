{% comment %}Usage: {% include image.html src="/assets/img/file.jpg" alt="..." %}. With no src, shows a grey placeholder; pass caption="what the photo should show" and optionally ratio="4/3" (default 16/9).{% endcomment %}
<figure class="media">
{% if include.src %}
  <img src="{{ include.src | relative_url }}" alt="{{ include.alt }}" loading="lazy">
{% else %}
  <div class="ph-photo" style="aspect-ratio:{{ include.ratio | default: '16/9' }}" role="img" aria-label="Photo to come{% if include.caption %}: {{ include.caption | escape }}{% endif %}"><span>Photo needed{% if include.caption %}: {{ include.caption }}{% endif %}</span></div>
{% endif %}
</figure>
