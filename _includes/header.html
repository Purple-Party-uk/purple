<header class="site-header">
  <div class="wrap nav">
    <a href="{{ '/' | relative_url }}" class="wordmark" aria-label="Purple home">{% include logo.html %}</a>
    <button class="burger" aria-expanded="false" aria-controls="menu" id="burger">Menu</button>
    <ul class="menu" id="menu">
      {% assign n = page.nav %}
      <li><a href="{{ '/' | relative_url }}" {% if n == 'home' %}class="active" aria-current="page"{% endif %}>Home</a></li>
      <li><a href="{{ '/policies/' | relative_url }}" {% if n == 'policies' %}class="active" aria-current="page"{% endif %}>Policies</a></li>
      <li><a href="{{ '/bills/' | relative_url }}" {% if n == 'bills' %}class="active" aria-current="page"{% endif %}>Bills</a></li>
      <li><a href="{{ '/writing/' | relative_url }}" {% if n == 'writing' %}class="active" aria-current="page"{% endif %}>Speeches &amp; Writing</a></li>
      <li><a href="{{ '/about/' | relative_url }}" {% if n == 'about' %}class="active" aria-current="page"{% endif %}>About</a></li>
      <li><a href="{{ '/donate/' | relative_url }}" {% if n == 'donate' %}class="active" aria-current="page"{% endif %}>Donate</a></li>
      <li><a href="{{ '/join/' | relative_url }}" class="join">Join</a></li>
    </ul>
  </div>
</header>
