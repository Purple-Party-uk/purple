<header class="site-header">
  <div class="wrap nav">
    <a href="{{ '/' | relative_url }}" class="wordmark" aria-label="Purple home">{% include logo.html %}</a>
    <button class="burger" aria-expanded="false" aria-controls="menu" id="burger">Menu</button>
    <ul class="menu" id="menu">
      {% assign n = page.nav %}
      <li><a href="{{ '/plan/' | relative_url }}" {% if n == 'plan' %}class="active" aria-current="page"{% endif %}>The Plan</a></li>
      <li><a href="{{ '/policies/' | relative_url }}" {% if n == 'policies' %}class="active" aria-current="page"{% endif %}>Policies</a></li>
      <li><a href="{{ '/first-year/' | relative_url }}" {% if n == 'first-year' %}class="active" aria-current="page"{% endif %}>First Year</a></li>
      <li><a href="{{ '/join/' | relative_url }}" class="join">Join</a></li>
    </ul>
  </div>
</header>
