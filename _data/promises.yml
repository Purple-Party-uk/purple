# The six promises on the homepage. Exactly six: more reads as over-promising.
# promise: a lived outcome in plain words, under ten words.
# line: one sentence saying what changes in someone's life.
# stage: the Plan stage where this promise starts (year1, years2-5, years6-10, beyond).
# test: the measurable test shown on the Plan (metric, target and source).
- promise: "Free from debt"
  line: "We clear the debts that keep people stuck, starting with student loans, credit cards and car finance, then mortgages."
  stage: years2-5
  test: "[Metric, target and source]"
- promise: "A home of your own"
  line: "Your rent buys you a growing share of your home, until it is yours."
  stage: years2-5
  test: "[Metric, target and source]"
- promise: "Work that pays, savings that are yours"
  line: "A wage you can live on, rights from your first day, and a pot in a national wealth fund in your own name."
  stage: year1
  test: "[Metric, target and source]"
- promise: "Health and education for everyone"
  line: "An NHS at full strength, with dentists and mental health care everywhere, and free education from childcare to university."
  stage: year1
  test: "[Metric, target and source]"
- promise: "A country that makes things"
  line: "We invest in research, put energy in public hands, and give workers the first chance to buy the firms they work for."
  stage: year1
  test: "[Metric, target and source]"
- promise: "Politics that belongs to you"
  line: "We take big money out of politics, replace the House of Lords and make every vote count."
  stage: year1
  test: "[Metric, target and source]"
