# Purple website — Jekyll config (GitHub Pages builds this automatically)
title: Purple
description: "The country got richer. You didn’t. Let’s change that. Every Purple policy is published in full, with our best estimate of what it costs."
lang: en-GB

# If the site lives at https://USERNAME.github.io/REPO/ set baseurl to "/REPO".
# If you use a custom domain (CNAME) or a USERNAME.github.io repo, leave it empty.
baseurl: "/purple"
url: ""

# ---- Links to fill in before launch (leave "" until ready) ----
manifesto_pdf: "/assets/purple-manifesto.pdf"   # upload the PDF to this path
donate_url: ""        # payment provider checkout page
join_form_url: ""     # MS Forms / Google Forms link for "Register your interest"
comment_form_endpoint: ""  # form service endpoint for "Have your say"
substack_url: "https://joshuaskoczylis.substack.com"
imprint: "Promoted by [Name] on behalf of Purple, [full postal address]."

collections:
  themes:
    output: true
    permalink: /policies/:name/
  policies:
    output: true
    permalink: /policies/:path/
  bills:
    output: true
    permalink: /bills/:name/

defaults:
  - scope: { type: themes }
    values: { layout: theme }
  - scope: { type: policies }
    values: { layout: policy }
  - scope: { type: bills }
    values: { layout: bill }

exclude: [README.md]
